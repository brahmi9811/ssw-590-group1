# Scrape configuration (course manual Chapter 5, step 2.3), adapted to Group 1's real login URLs.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus                        # Prometheus' own metrics
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node                              # whole-host CPU, memory, root filesystem
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox                          # the Blackbox Exporter's own health metrics
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: https                             # HTTPS availability probes (multi-target pattern)
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://git.ssw590-g1.tech/user/login
          - https://ci.ssw590-g1.tech/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
