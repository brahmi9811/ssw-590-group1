[delivery]
# The Group 1 server, reached from the trusted agent container over the Docker bridge, not over the Internet:
# the security group admits SSH only from team addresses, and the server cannot reach its own Elastic IP on port 22.
# The agent's compose file maps deploy-target to host-gateway (extra_hosts: "deploy-target:host-gateway"), and
# HostKeyAlias makes OpenSSH verify the pinned key of git.ssw590-g1.tech in ansible/known_hosts.
# The deploy account and its private key are created by BD; the key lives only in Jenkins credentials.
startup ansible_host=deploy-target ansible_user=deploy

[delivery:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_extra_args=-o HostKeyAlias=git.ssw590-g1.tech -o StrictHostKeyChecking=yes
