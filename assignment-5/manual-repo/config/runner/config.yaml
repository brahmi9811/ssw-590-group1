# act_runner configuration (non-secret).
log:
  level: info

runner:
  file: /data/.runner
  capacity: 1          # one job at a time: the host has about 1 GB RAM
  timeout: 1h

cache:
  enabled: false       # artifacts go through Gitea, not the runner cache

container:
  network: ""          # default: a fresh network per job
  privileged: false
  force_pull: false    # the job image is local-only (built on this host); never re-download it
  force_rebuild: false
