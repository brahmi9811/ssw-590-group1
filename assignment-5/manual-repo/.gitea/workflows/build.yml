# Builds the Group 1 DevOps IT manual on every push to main and publishes the PDF as an artifact.
# Runs on the team's self-managed Gitea runner; the label below must map to the job image built
# from ci/Dockerfile (TeX Live pinned by digest + Node.js for the JavaScript actions).
name: Build IT manual

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: manual-builder
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4

      - name: Record the toolchain
        run: |
          set -euo pipefail
          pdflatex --version | head -n 1
          latexmk --version | tail -n 1
          pygmentize -V
          node --version

      - name: Compute the build identifier
        id: buildid
        run: |
          set -euo pipefail
          short="$(printf '%s' "${{ gitea.sha }}" | cut -c1-7)"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "suffix=+build.${{ gitea.run_number }}.${short}" >> "$GITHUB_OUTPUT"
          echo "Build identifier: +build.${{ gitea.run_number }}.${short} (attempt ${{ gitea.run_attempt }})"

      - name: Compile the manual (fails on any LaTeX error)
        run: |
          set -euo pipefail
          latexmk -pdf -shell-escape -interaction=nonstopmode -halt-on-error \
            -usepretex='\def\BuildSuffix{${{ steps.buildid.outputs.suffix }}}\def\BuildRun{${{ gitea.run_number }}}\def\BuildCommit{${{ steps.buildid.outputs.short }}}' \
            devopsITManual.tex

      - name: Verify the PDF exists and carries the build identifier
        run: |
          set -euo pipefail
          test -s devopsITManual.pdf || { echo "::error::devopsITManual.pdf is missing or empty"; exit 1; }
          if grep -E "undefined references|multiply defined" devopsITManual.log; then
            echo "::error::unresolved or duplicate references in the final pass"; exit 1
          fi
          grep -F "Build identifier: Version" devopsITManual.log
          grep -qF "${{ steps.buildid.outputs.suffix }}" devopsITManual.log \
            || { echo "::error::build identifier not found in the LaTeX log"; exit 1; }
          mkdir -p out
          cp devopsITManual.pdf "out/IT-manual${{ steps.buildid.outputs.suffix }}.pdf"
          ls -l out

      - name: Upload the PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: it-manual-pdf
          path: out/*.pdf
          if-no-files-found: error
